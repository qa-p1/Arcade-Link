[workspace]
resolver = "2"
members = ["crates/arcade-link", "crates/arcade-link-cli"]
# Fleet app checkouts for the nightly e2e live under target/fleet.
exclude = ["target"]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qa-p1/Arcade-link"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
