[package]
name = "arcade-link-cli"
description = "arcade-link: inspect and drive Arcade Link apps (ls, describe, invoke, watch, mock)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "arcade-link"
path = "src/main.rs"

[dependencies]
arcade-link = { path = "../arcade-link", features = ["watch", "trayhost", "install"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
