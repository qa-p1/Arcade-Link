[package]
name = "arcade-link"
description = "Arcade Link: registry, presence and wire protocol shared by the Arcade apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# A lazily started directory watcher (inotify / FSEvents / ReadDirectoryChangesW)
# that refreshes a shared registry when manifests or endpoints change.
watch = ["dep:notify"]
# Finding and downloading helper programs the apps don't ship (Tesseract).
engines = ["dep:sha2"]
# Explicit-path installation and integration helpers.
install = []
# OS notifications and a blocking subscription to the tray host.
trayhost = ["watch"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.4"
getrandom = "0.4"
notify = { version = "8", optional = true, default-features = false, features = ["macos_fsevent"] }
sha2 = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[dev-dependencies]
