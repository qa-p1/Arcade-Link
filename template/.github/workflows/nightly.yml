# Nightly: main CI's tested files as a signed prerelease; skipped when main is unchanged.
name: Nightly
on:
  schedule: [{ cron: "23 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
  nightly:
    needs: version
    uses: qa-p1/Arcade-Link/.github/workflows/app-nightly.yml@v1.0.3
    with: { link-ref: v1.0.3, app: arcade.template, version: "${{ needs.version.outputs.version }}" }
    secrets: { ARCADE_UPDATE_SIGNING_KEY: "${{ secrets.ARCADE_UPDATE_SIGNING_KEY }}" }
