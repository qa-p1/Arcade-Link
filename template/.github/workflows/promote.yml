# Promote a verified rc to stable: the same bytes, a signed manifest, no rebuild.
name: Promote
on:
  workflow_dispatch:
    inputs:
      rc-tag: { description: "Verified rc, e.g. v0.1.0-rc.2", required: true }
permissions:
  contents: write
jobs:
  promote:
    uses: qa-p1/Arcade-Link/.github/workflows/app-promote.yml@v1.0.3
    with: { link-ref: v1.0.3, rc-tag: "${{ inputs.rc-tag }}" }
    secrets: { ARCADE_UPDATE_SIGNING_KEY: "${{ secrets.ARCADE_UPDATE_SIGNING_KEY }}" }
