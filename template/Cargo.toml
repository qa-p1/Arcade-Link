[package]
name = "arcade-template"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
publish = false
description = "The smallest Arcade app: a starting point that already meets ARCADE_APP.md"

[dependencies]
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", tag = "v1.0.3", features = ["design-egui"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
