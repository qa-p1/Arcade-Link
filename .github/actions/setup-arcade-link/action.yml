name: Set up arcade-link
description: Builds (or restores) the arcade-link CLI from this checkout of Arcade Link and puts it on PATH.
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      # The runner image is part of the key: a CLI built on ubuntu-24.04 needs glibc 2.39 and fails on ubuntu-22.04
      # ("GLIBC_2.39 not found"), and runner.os is "Linux" on both (Box's rc.2 gates restored main's 24.04 build).
      run: |
        echo "sha=$(git -C '${{ github.action_path }}/../../..' rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "image=$("${{ github.action_path }}/../../../tools/ci/runner-image.sh")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.arcade-link
        key: arcade-link-cli-${{ steps.key.outputs.image }}-${{ steps.key.outputs.sha }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        for i in 1 2 3; do
          timeout 900 cargo install --locked --path crates/arcade-link-cli --root ~/.arcade-link && break
          sleep $((i * 5))
        done
        test -x ~/.arcade-link/bin/arcade-link
    - shell: bash
      run: |
        echo "$HOME/.arcade-link/bin" >> "$GITHUB_PATH"
        echo "ARCADE_LINK_TOOLS=$(cd '${{ github.action_path }}/../../../tools' && pwd)" >> "$GITHUB_ENV"
