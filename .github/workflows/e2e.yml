name: Ecosystem e2e

on:
  push:
  pull_request:
    # `labeled`: adding the e2e-real-fleet label runs the opt-in matrix on a PR.
    types: [opened, synchronize, reopened, labeled]
  # Nightly: the full real-app matrix against the latest green sibling builds.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      real_apps:
        description: Download the latest successful Tools-hub Linux artifacts and exercise the real fleet
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: '3'

jobs:
  contract:
    name: Isolated Link contracts (deterministic)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Isolation tools
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 xvfb xdotool
      - name: Build pinned CLI and install harness
        run: |
          cargo build -p arcade-link-cli --locked
          cargo build -p arcade-link --example install-harness --features install --locked
      - name: Contract checks in disposable D-Bus/Xvfb/HOME
        env:
          ARCADE_E2E_REPORT_DIR: ${{ github.workspace }}/target/e2e-reports
        run: python3 tools/e2e.py run -- python3 tools/e2e.py --only presence,install,trayhost,tools-hub
      - name: Real fleet availability is explicitly reported
        env:
          ARCADE_E2E_REPORT_DIR: ${{ github.workspace }}/target/e2e-reports
        # PRs never fetch mutable sibling branches or package heavyweight apps.
        # Eight per-app results say SKIP instead of pretending to test artifacts.
        run: python3 tools/e2e.py run -- python3 tools/e2e.py --real-apps --allow-skips --only install
      - name: Coverage table
        if: always()
        run: python3 tools/e2e_coverage.py target/e2e-reports | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-contract-results
          path: target/e2e-reports/*.json

  fleet:
    name: Pick the real fleet (newest green main artifacts)
    # Opt-in only (nightly, manual, or a PR labeled e2e-real-fleet); the
    # contract job above is the deterministic PR gate.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.real_apps) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-real-fleet'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Choose one green run per app (nothing downloaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/e2e_artifacts.py --pick-only --output target/fleet-pick
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-pick
          path: target/fleet-pick/fleet.json

  dev-builds:
    name: Development build (${{ matrix.app }})
    # The *_development_install_suppression checks run each app's native
    # development executable at the same commit as its package.
    needs: fleet
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [arcade.box, arcade.lens, arcade.look, arcade.wheel, arcade.shelf, arcade.find, arcade.clipboard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: fleet-pick
          path: target/fleet-pick
      - name: Source at the picked commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/e2e_artifacts.py --pinned target/fleet-pick/fleet.json --sources --only ${{ matrix.app }} --output target/fleet
          sha=$(python3 -c "import json; print(json.load(open('target/fleet/fleet.json'))['${{ matrix.app }}'].get('headSha', ''))")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -n "$sha"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ninja-build file libssl-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev wayland-protocols \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev libsecret-1-dev \
            libglib2.0-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcb-cursor0
      - uses: actions/setup-node@v4
        if: matrix.app == 'arcade.box' || matrix.app == 'arcade.look'
        with:
          node-version: 24
      - uses: jurplel/install-qt-action@v4
        if: matrix.app == 'arcade.wheel' || matrix.app == 'arcade.shelf'
        with:
          version: '6.8.3'
          modules: qtshadertools qtimageformats
          cache: true
      - uses: dtolnay/rust-toolchain@v1
        if: matrix.app != 'arcade.wheel' && matrix.app != 'arcade.shelf'
        with:
          toolchain: 1.88.0
      - name: Build
        run: python3 tools/fleet_build.py ${{ matrix.app }} target/fleet/${{ matrix.app }}/sources
      - name: Stage the executable with its commit
        run: |
          bin=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import fleet_build; print(fleet_build.dev_bin('${{ matrix.app }}'))")
          mkdir -p target/dev-build/$(dirname "$bin")
          cp "target/fleet/${{ matrix.app }}/sources/$bin" "target/dev-build/$bin"
          echo "${{ steps.source.outputs.sha }}" > target/dev-build/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ matrix.app }}
          path: target/dev-build/
          retention-days: 3

  real-fleet:
    name: Real fleet (${{ matrix.group }}, CI X11 only)
    needs: [fleet, dev-builds]
    # Run even when a development build failed: its checks then fail with the
    # missing build named, instead of the whole matrix disappearing.
    if: ${{ always() && needs.fleet.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [install, trayhost, tools-hub, shortcuts]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            target/real-driver-project -> ../real-driver
          key: e2e-tools-driver
      - name: Runtime and adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 xvfb xdotool gnome-keyring python3-dbus python3-gi libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libfuse2 libssl-dev pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1
      - uses: actions/download-artifact@v4
        with:
          name: fleet-pick
          path: target/fleet-pick
      - name: Fetch the picked artifacts and their exact sources
        env:
          GH_TOKEN: ${{ github.token }}
        # rust-cache may restore an earlier target/fleet; always start empty.
        run: |
          rm -rf target/fleet
          python3 tools/e2e_artifacts.py --pinned target/fleet-pick/fleet.json --sources --output target/fleet
      - uses: actions/download-artifact@v4
        if: matrix.group == 'install'
        with:
          pattern: dev-build-*
          path: target/dev-builds
      - uses: jurplel/install-qt-action@v4
        if: matrix.group == 'install'
        with:
          version: '6.8.3'
          modules: qtshadertools qtimageformats
          cache: true
      - name: Place the development builds (same commit only)
        if: matrix.group == 'install'
        run: |
          for dir in target/dev-builds/dev-build-*; do
            [ -d "$dir" ] || continue
            app=${dir##*/dev-build-}
            want=$(python3 -c "import json; print(json.load(open('target/fleet/fleet.json')).get('$app', {}).get('headSha', ''))")
            if [ "$(cat "$dir/COMMIT")" != "$want" ]; then echo "SKIP $app: built $(cat "$dir/COMMIT"), fleet has $want"; continue; fi
            rm "$dir/COMMIT"
            (cd "$dir" && find . -type f) | while read -r file; do
              install -D -m 0755 "$dir/$file" "target/fleet/$app/sources/$file"
            done
            echo "PLACED $app"
          done
      - name: Catalog shortcut sheets (public catalog, main)
        run: git clone --quiet --depth 1 https://github.com/qa-p1/Arcade-catalog.git target/fleet/catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Tools' branch CI publishes no Linux AppImage; build the native debug
      # binary from the same green commit. If this fails, every Tools-backed
      # check reports SKIP (missing executable build), never a pass.
      - name: Build Tools natively from its green commit
        continue-on-error: true
        working-directory: target/fleet/arcade.tools/sources
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          npm ci
          npm run build
          cargo build -p arcade-tools -p arcade-tools-overlay --locked
      - name: Build the released CLI and the actual Tools core adapter
        env:
          ARCADE_E2E_ARTIFACTS: ${{ github.workspace }}/target/fleet/fleet.json
        run: |
          cargo build -p arcade-link-cli --locked
          python3 tools/real_apps.py
      - name: Isolated real-app checks (unavailable artifacts explicitly skipped)
        env:
          ARCADE_E2E_ARTIFACTS: ${{ github.workspace }}/target/fleet/fleet.json
          ARCADE_CATALOG_REPO: ${{ github.workspace }}/target/fleet/catalog
          ARCADE_E2E_REPORT_DIR: ${{ github.workspace }}/target/e2e-reports
          E2E_VERBOSE: '1'
        # Other prerequisites may skip, but a missing package or development
        # build fails the check it was needed for (--require-artifacts).
        run: python3 tools/e2e.py run -- python3 tools/e2e.py --real-apps --allow-skips --require-artifacts --only ${{ matrix.group }}
      - name: Coverage table
        if: always()
        run: python3 tools/e2e_coverage.py target/e2e-reports --fleet target/fleet/fleet.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-real-${{ matrix.group }}
          path: |
            target/e2e-reports/*.json
            target/fleet/fleet.json
