name: Dispatch checked Link 0.4.11 tag
on:
  push:
    branches: [ops/dispatch-link-v0.4.11]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the exact successful main CI run, then dispatch tag.yml
        run: |
          gh api repos/$GH_REPO/actions/runs/41050031821 > "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['head_sha']=='047b686d9b02de6dcf7bdfa77c85bf7eefbf7264' and r['conclusion']=='success'
          PY
          gh api --method POST repos/$GH_REPO/actions/workflows/tag.yml/dispatches --input - <<'JSON'
          {"ref":"main","inputs":{"tag":"v0.4.11","sha":"047b686d9b02de6dcf7bdfa77c85bf7eefbf7264"}}
          JSON
