name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Permissions, the stale-endpoint case and the macOS socket path length
      # are covered by the crate's own tests on each OS.
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Feature hygiene
        shell: bash
        run: |
          cargo test -p arcade-link --no-default-features --locked
          for feature in install trayhost watch engines design design-egui; do
            cargo test -p arcade-link --no-default-features --features "$feature" --locked
          done
      - name: Release manifest tool
        run: python3 -m unittest discover -s tools -p "test_*.py"

  design:
    name: Design kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generated files are current; contrast and shortcut checks
        run: python3 design/generate.py --check
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Rust kit (palette, icons, format, egui)
        run: cargo test -p arcade-link --features design,design-egui --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript kit (format helpers, icon map) and QML Format.js
        run: |
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2020 --lib es2020,dom design/css/format.ts design/css/icons.ts
          python3 -m unittest discover -s tools -p "test_design.py"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Dart kit (theme, icons, format helpers)
        run: bash tools/check_dart_kit.sh

  qt:
    name: Qt module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      # Some ubuntu-24.04 images ship a partially installed 1.88.0; rustup's
      # recovery then fails on a leftover bin/cargo-clippy. Start clean.
      - name: Remove a partially installed Rust 1.88.0
        if: runner.os == 'Linux'
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the debug CLI (for interop tests)
        run: cargo build -p arcade-link-cli --locked
      - name: OpenGL headers for Qt Quick (design kit test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
      - name: Configure
        shell: bash
        run: cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Linux' && '-DARCADE_LINK_REQUIRE_DESIGN_TESTS=ON' || '' }}
      - name: Build
        run: cmake --build qt/build --config Release
      - name: Test (conformance vectors + Rust interop)
        shell: bash
        run: |
          cli="$PWD/target/debug/arcade-link"
          [ -f "$cli.exe" ] && cli="$cli.exe"
          ARCADE_LINK_CLI="$cli" ctest --test-dir qt/build -C Release --output-on-failure
      - name: Print Qt test logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem qt/build -Filter '*.txt' | Where-Object Name -ne 'CMakeCache.txt' | ForEach-Object {
            Write-Host "Qt test log: $($_.Name)"
            Get-Content $_.FullName
          }

  windows-installers:
    name: Shared Windows installers (CI account only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        shell: pwsh
        run: |
          choco install innosetup nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler setup failed' }
      - name: Build both samples
        shell: pwsh
        working-directory: packaging/windows/samples
        run: |
          Copy-Item "$env:WINDIR\System32\whoami.exe" sample.exe
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) { $inno = (Get-Command ISCC.exe).Source }
          & $inno sample.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno compilation failed' }
          & $inno /DARCADE_VERSION=0.3.1 /DARCADE_SETUP_FILENAME=sample-inno-newer sample.iss
          if ($LASTEXITCODE -ne 0) { throw 'Newer Inno compilation failed' }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = (Get-Command makensis.exe).Source }
          & $nsis /V4 sample.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          & $nsis /V4 /DARCADE_VERSION=0.3.1 /DARCADE_SETUP_FILENAME=sample-nsis-newer.exe sample.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Newer NSIS compilation failed' }
      - name: Verify silent install and uninstall
        # Use Windows PowerShell 5.1, the same host invoked by the installers.
        shell: powershell
        working-directory: packaging/windows/samples
        run: |
          .\verify-identity.ps1
          .\verify.ps1
