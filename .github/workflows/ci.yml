name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Permissions, the stale-endpoint case and the macOS socket path length
      # are covered by the crate's own tests on each OS.
      - name: minisign (verifies our manifest signatures)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do sudo apt-get install -y --no-install-recommends minisign && break; sudo apt-get update -o Acquire::Retries=3; done
          echo ARCADE_REQUIRE_MINISIGN=1 >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Another user is refused (needs root)
        if: runner.os == 'Linux'
        run: |
          bin=$(cargo test -p arcade-link --test peer_uid --no-run --locked --message-format=json | jq -r 'select(.executable != null and .target.name == "peer_uid") | .executable')
          sudo ARCADE_REQUIRE_ROOT_TESTS=1 "$bin" --test-threads=1
      # Feature combinations are platform-independent: one OS is enough.
      - name: Feature hygiene
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p arcade-link --no-default-features --locked
          for feature in install trayhost watch engines design design-egui release; do
            cargo test -p arcade-link --no-default-features --features "$feature" --locked
          done
      - name: Release manifest tool
        run: python3 -m unittest discover -s tools -p "test_*.py"

  template:
    name: Template app (build, AppImage, conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            template -> target
      - name: Build against this checkout of Link
        working-directory: template
        run: |
          ./use-local-link.sh
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build --release
      # appimagetool and its type2 runtime come from GitHub releases; cached so a download outage (HTTP 504 for 10+
      # minutes) cannot fail CI.
      - uses: actions/cache@v4
        with: { path: ~/.cache/arcade-appimagetool, key: appimagetool-continuous-x86_64-v2 }
      - name: AppImage
        timeout-minutes: 8
        working-directory: template
        run: |
          dir=~/.cache/arcade-appimagetool; tool=$dir/appimagetool; runtime=$dir/runtime-x86_64
          mkdir -p "$dir"
          get() { [ -s "$2" ] || curl -fsSL --retry 5 --retry-delay 10 --max-time 300 -o "$2" "$1"; }
          get https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage "$tool"
          get https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 "$runtime"
          chmod +x "$tool"
          APPIMAGETOOL="$tool" APPIMAGE_RUNTIME="$runtime" packaging/linux/build-appimage.sh
      - name: Conformance (repository and AppImage)
        run: |
          git -C template checkout Cargo.toml
          cargo build -p arcade-link-cli --locked
          target/debug/arcade-link conformance template --binary template/dist/*.AppImage
          target/debug/arcade-link conformance template/dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: template-appimage, path: template/dist/*.AppImage }

  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  n-1:
    name: N-1 (previous Link release ↔ this one)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build this CLI and the previous release's
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" | head -1)
          echo "previous release: $prev"
          git worktree add ../prev "$prev"
          cargo build -p arcade-link-cli --locked
          (cd ../prev && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/prev" cargo build -p arcade-link-cli --locked)
      - name: Talk both ways
        run: python3 tools/n1_compat.py target/prev/debug/arcade-link target/debug/arcade-link

  design:
    name: Design kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generated files are current; contrast and shortcut checks
        run: python3 design/generate.py --check
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Rust kit (palette, icons, format, egui)
        run: cargo test -p arcade-link --features design,design-egui --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript kit (format helpers, icon map) and QML Format.js
        run: |
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2020 --lib es2020,dom design/css/format.ts design/css/icons.ts
          python3 -m unittest discover -s tools -p "test_design.py"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Dart kit (theme, icons, format helpers)
        run: bash tools/check_dart_kit.sh

  qt:
    name: Qt module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      # Some ubuntu-24.04 images ship a partially installed 1.88.0; rustup's
      # recovery then fails on a leftover bin/cargo-clippy. Start clean.
      - name: Remove a partially installed Rust 1.88.0
        if: runner.os == 'Linux'
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the debug CLI (for interop tests)
        run: cargo build -p arcade-link-cli --locked
      - name: OpenGL headers for Qt Quick (design kit test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
      - name: Configure
        shell: bash
        run: cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Linux' && '-DARCADE_LINK_REQUIRE_DESIGN_TESTS=ON' || '' }}
      - name: Build
        run: cmake --build qt/build --config Release
      - name: Test (conformance vectors + Rust interop)
        shell: bash
        run: |
          cli="$PWD/target/debug/arcade-link"
          [ -f "$cli.exe" ] && cli="$cli.exe"
          ARCADE_LINK_CLI="$cli" ctest --test-dir qt/build -C Release --output-on-failure
      - name: Lint the QML design kit
        if: runner.os == 'Linux'
        run: qmllint -I design/qml --max-warnings 0 design/qml/Arcade/*.qml design/qml/gallery/Gallery.qml
      - name: Print Qt test logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem qt/build -Filter '*.txt' | Where-Object Name -ne 'CMakeCache.txt' | ForEach-Object {
            Write-Host "Qt test log: $($_.Name)"
            Get-Content $_.FullName
          }

  windows-installers:
    name: Shared Windows installers (CI account only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        shell: pwsh
        run: |
          choco install innosetup nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler setup failed' }
      - name: Build both samples
        shell: pwsh
        working-directory: packaging/windows/samples
        run: |
          Copy-Item "$env:WINDIR\System32\whoami.exe" sample.exe
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) { $inno = (Get-Command ISCC.exe).Source }
          & $inno sample.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno compilation failed' }
          & $inno /DARCADE_VERSION=0.3.1 /DARCADE_SETUP_FILENAME=sample-inno-newer sample.iss
          if ($LASTEXITCODE -ne 0) { throw 'Newer Inno compilation failed' }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = (Get-Command makensis.exe).Source }
          & $nsis /V4 sample.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
          & $nsis /V4 /DARCADE_VERSION=0.3.1 /DARCADE_SETUP_FILENAME=sample-nsis-newer.exe sample.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Newer NSIS compilation failed' }
      - name: Verify silent install and uninstall
        # Use Windows PowerShell 5.1, the same host invoked by the installers.
        shell: powershell
        working-directory: packaging/windows/samples
        run: |
          .\verify-identity.ps1
          .\verify.ps1
