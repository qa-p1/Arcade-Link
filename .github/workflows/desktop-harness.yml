# The harness proving itself (specs/LINK.md §1.4): the driver self-test, the
# popup rule on a fixed and a broken stand-in, and C0 on the released Clipboard.
name: Desktop harness
concurrency:
  group: desktop-harness-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths: ["tools/desktop/**", ".github/workflows/desktop-e2e.yml", ".github/workflows/desktop-harness.yml"]
  workflow_dispatch:
jobs:
  selftest:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      name: selftest
      test: link:tools/desktop/tests/selftest.py
      link-ref: ${{ github.event.pull_request.head.sha || github.sha }}
  popup-fixed:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      name: popup-fixed
      test: link:tools/desktop/tests/popup_survives_pointer_leave.py
      args: stub
      link-ref: ${{ github.event.pull_request.head.sha || github.sha }}
  popup-broken:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      name: popup-broken
      test: link:tools/desktop/tests/popup_survives_pointer_leave.py
      args: stub --close-on-blur
      expect-exit: 10
      link-ref: ${{ github.event.pull_request.head.sha || github.sha }}
  clipboard-c0:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      name: clipboard-c0
      test: link:tools/desktop/tests/popup_survives_pointer_leave.py
      args: clipboard "$APP"
      appimage-url: https://github.com/qa-p1/Arcade-clipboard/releases/download/v0.3.2/Arcade-Clipboard-0.3.2-x86_64.AppImage
      expect-exit: 10
      link-ref: ${{ github.event.pull_request.head.sha || github.sha }}
