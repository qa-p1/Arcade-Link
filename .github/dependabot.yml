# Weekly, one grouped pull request per ecosystem for minor and patch updates (majors stay separate), and no
# automatic rebase: each rebase started a full CI run (three OSes, the template app, the e2e contracts) per open
# pull request whenever main moved, which queued release work behind them. Ask "@dependabot rebase" on a pull
# request to refresh it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      cargo: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    rebase-strategy: disabled
    groups:
      actions: { update-types: [minor, patch] }
